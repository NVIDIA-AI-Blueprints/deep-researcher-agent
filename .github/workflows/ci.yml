name: AIQ CI

# Trigger: push-only. All PRs (internal and external) are mirrored to
# pull-request/<N> branches by copy-pr-bot after `/ok to test` approval.
# Direct pushes to develop or release branches also trigger CI.
on:
  push:
    branches:
      - develop
      - "release/**"
      - "pull-request/[0-9]+"

permissions:
  contents: read

concurrency:
  group: aiq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Lint and Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "0.11.26"
          cache-dependency-glob: |
            uv.lock
            mcp/uv.lock

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Install dev dependencies
        run: |
          uv venv --python 3.13 .venv
          uv sync --frozen --group dev
          uv pip install nbconvert

      - name: Ruff checks
        run: |
          . .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Run remaining pre-commit hooks
        run: |
          . .venv/bin/activate
          SKIP=ruff-check,ruff-format,pytest-root,pytest-mcp,helm-lint pre-commit run --all-files

  test:
    name: Pytest and Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: aiq
          POSTGRES_PASSWORD: aiq_mcp_ci_password # pragma: allowlist secret
          POSTGRES_DB: aiq_mcp_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U aiq -d aiq_mcp_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AIQ_MCP_TEST_DB_URL: postgresql://aiq:aiq_mcp_ci_password@127.0.0.1:5432/aiq_mcp_tests # pragma: allowlist secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "0.11.26"
          cache-dependency-glob: |
            uv.lock
            mcp/uv.lock

      - name: Install test dependencies
        run: |
          set -euo pipefail
          uv venv --python 3.13 .venv
          uv sync --frozen --group dev --extra sandboxed-python-test
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/aiq-mcp-test-venv" \
            uv sync --project mcp --frozen --extra dev

      - name: Validate isolated dependency environments
        run: |
          set -euo pipefail
          . .venv/bin/activate
          uv pip check
          "$RUNNER_TEMP/aiq-mcp-test-venv/bin/python" \
            mcp/scripts/check_runtime_dependencies.py

      - name: Run mandatory MCP PostgreSQL tests
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/aiq-mcp-test-venv/bin/python" -X faulthandler -m pytest mcp/tests -v \
            --junitxml=mcp-report.xml \
            --cov=mcp/src/aiq_mcp \
            --cov-report=xml:mcp-coverage.xml \
            --cov-report=html:mcp-htmlcov \
            --cov-report=term \
            --cov-fail-under=90
          "$RUNNER_TEMP/aiq-mcp-test-venv/bin/python" - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("mcp-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          if skipped:
              raise SystemExit(f"MCP PostgreSQL lane unexpectedly skipped {skipped} tests")
          PY

      - name: Run repository tests with coverage
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -X faulthandler -m pytest tests/ sources/ -v \
            --junitxml=report.xml \
            --cov=src/aiq_agent \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --cov-fail-under=65

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: |
            report.xml
            coverage.xml
            htmlcov/
            mcp-report.xml
            mcp-coverage.xml
            mcp-htmlcov/
          retention-days: 7

  nemo-retriever-local-install:
    name: Embedded NRL integration (${{ matrix.os-label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os-label: linux-x64
          - runner: windows-latest
            os-label: windows-x64
          # Match NeMo Retriever's own Apple Silicon library-mode CI lane.
          - runner: macos-26
            os-label: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "0.11.26"
          cache-dependency-glob: environments/nemo_retriever_local/uv.lock

      - name: Validate and install isolated lock
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/aiq-nemo-retriever-local-venv
        run: |
          set -euo pipefail
          uv lock --project environments/nemo_retriever_local --check
          uv sync --project environments/nemo_retriever_local --frozen --no-default-groups --group test

      - name: Test embedded LanceDB and native server lifecycle
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/aiq-nemo-retriever-local-venv
        run: |
          set -euo pipefail
          uv run --project environments/nemo_retriever_local --frozen --no-sync python - <<'PY'
          import tempfile

          import ray

          from knowledge_layer.nemo_retriever._local_client import _load_nrl_bindings
          from knowledge_layer.nemo_retriever.local_adapter import NemoRetrieverLocalIngestor

          assert ray.is_initialized() is False
          bindings = _load_nrl_bindings()
          with tempfile.TemporaryDirectory() as data_dir:
              ingestor = NemoRetrieverLocalIngestor(
                  {"data_dir": data_dir, "scope": "ci", "profile": "fast-text", "_bindings": bindings}
              )
              ingestor.close()
          assert ray.is_initialized() is False
          PY
          uv run --project environments/nemo_retriever_local --frozen --no-sync \
            python -m pytest -q \
              tests/knowledge_layer_tests/test_nemo_retriever_local_adapter.py \
              tests/knowledge_layer_tests/test_nemo_retriever_local_integration.py

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm charts
        run: |
          for chart in deploy/helm/helm-charts-k8s/*; do
            if [ -d "$chart" ]; then
              helm lint "$chart"
            fi
          done

  test-scripts:
    name: Script Validation
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ci-not-a-real-key # pragma: allowlist secret
      TAVILY_API_KEY: ci-not-a-real-key # pragma: allowlist secret
      AIQ_MCP_IMAGE: aiq-mcp-server:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "0.11.26"
          cache-dependency-glob: |
            uv.lock
            mcp/uv.lock

      - name: Install script test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.13 .venv
          uv sync --frozen --group dev --extra sandboxed-python-test
          for pkg in \
            ./frontends/benchmarks/freshqa \
            ./frontends/benchmarks/intent_classifier
          do
            if [ -d "$pkg" ]; then
              uv pip install --no-deps -e "$pkg"
            fi
          done

      - name: Run script tests
        run: |
          . .venv/bin/activate
          chmod +x ci/scripts/test_scripts.sh
          ci/scripts/test_scripts.sh --skip-setup

      - name: Validate VCS-less AI-Q release artifact on Python 3.11
        env:
          UV_PYTHON: "3.11"
        run: ci/scripts/test_release_artifact.sh

      - name: Create MCP production environment
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/aiq-mcp-venv" \
            uv sync --project mcp --frozen --no-dev --no-default-groups --no-editable
          "$RUNNER_TEMP/aiq-mcp-venv/bin/python" \
            mcp/scripts/check_runtime_dependencies.py

      - name: Capture complete vulnerability evidence
        run: |
          set -euo pipefail
          audit_status=0
          uv audit --preview-features audit-command,json-output \
            --project mcp --frozen --no-dev --no-default-groups \
            --output-format json > aiq-mcp-vulnerabilities.json || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then
            exit "$audit_status"
          fi

      - name: Gate production dependency lock
        run: |
          set -euo pipefail
          uv audit --preview-features audit-command,json-output \
            --project mcp --frozen --no-dev --no-default-groups \
            --ignore-until-fixed GHSA-f4j7-r4q5-qw2c \
            --ignore-until-fixed GHSA-2wm9-hf6c-p5cr \
            --ignore-until-fixed GHSA-36p7-vc44-83pf \
            --ignore-until-fixed GHSA-xph7-9rjv-w5fr \
            --output-format json > "$RUNNER_TEMP/aiq-mcp-vulnerability-gate.json"

      - name: Generate MCP SBOM and license evidence
        run: |
          set -euo pipefail
          uv export --preview-features sbom-export \
            --project mcp --frozen --no-dev --no-default-groups \
            --format cyclonedx1.5 --output-file aiq-mcp.cdx.json >/dev/null
          "$RUNNER_TEMP/aiq-mcp-venv/bin/python" \
            mcp/scripts/check_license_inventory.py \
            aiq-mcp.cdx.json aiq-mcp-licenses.json

      # This locally built wheel is an internal package/license check, not a
      # published release artifact. Supported distribution uses the frozen
      # source project or the release container built below.
      - name: Verify MCP package license metadata
        run: |
          set -euo pipefail
          uv build mcp --wheel --out-dir "$RUNNER_TEMP/mcp-dist"
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          wheel = next((Path(os.environ["RUNNER_TEMP"]) / "mcp-dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names
          PY

      - name: Upload MCP release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-release-evidence
          path: |
            aiq-mcp.cdx.json
            aiq-mcp-vulnerabilities.json
            aiq-mcp-licenses.json
          if-no-files-found: error
          retention-days: 30

      - name: Build and boot MCP Compose stack
        run: |
          set -euo pipefail
          docker compose -f deploy/compose/docker-compose.mcp.yaml up --detach --build --wait --wait-timeout 300

      - name: Verify MCP health and protocol
        run: |
          set -euo pipefail
          test "$(curl --fail --silent http://127.0.0.1:9001/live)" = '{"status":"alive"}'
          test "$(curl --fail --silent http://127.0.0.1:9001/health)" = '{"status":"ready"}'
          "$RUNNER_TEMP/aiq-mcp-venv/bin/python" \
            mcp/scripts/protocol_smoke.py --url http://127.0.0.1:9001/mcp

      - name: Capture MCP container logs
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.mcp.yaml logs --no-color > mcp-compose.log || true

      - name: Upload MCP failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-compose-logs
          path: mcp-compose.log
          retention-days: 7

      - name: Tear down MCP Compose stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.mcp.yaml down --volumes --remove-orphans
