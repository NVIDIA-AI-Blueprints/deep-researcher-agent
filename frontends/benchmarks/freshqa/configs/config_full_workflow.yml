# Deep Agent Workflow Configuration
# Full workflow with intent classification, depth routing, and research agents. Nemotron on NVIDIA API Catalog; add judge (OpenAI or Gemini) for evaluator.

general:
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

llms:
  nemotron_lightning_intent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.1
    top_p: 0.9
    max_tokens: 1024
    num_retries: 5
    parallel_tool_calls: false
    chat_template_kwargs:
      enable_thinking: false

  # Known limitation: Build-hosted Lightning can intermittently produce citation-incomplete shallow drafts.
  # Deep Researcher Agent fails closed; see docs/source/resources/troubleshooting.md#nemotron-35-lightning-on-nvidia-api-catalog.
  nemotron_lightning_agent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 8192
    num_retries: 5
    parallel_tool_calls: false
    chat_template_kwargs:
      enable_thinking: true

  nemotron_ultra_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false

  nemotron_ultra_writer_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false

  # Judge model for evaluator: set OPENAI_API_KEY or add a Gemini LLM and set evaluators.freshqa.llm_name.
  judge_llm:
    _type: openai
    model_name: "gpt-4o"
    api_key: ${OPENAI_API_KEY}
    temperature: 0.1

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool

  web_search_tool:
    _type: tavily_web_search
    max_results: 5

  intent_classifier:
    _type: intent_classifier
    llm: nemotron_lightning_intent_llm

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_lightning_agent_llm
    tools:
      - web_search_tool
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: nemotron_ultra_llm
    source_router_llm: nemotron_ultra_llm
    researcher_llm: nemotron_ultra_llm
    planner_llm: nemotron_ultra_llm
    writer_llm: nemotron_ultra_writer_llm
    max_loops: 2
    tools:
      - web_search_tool

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  tools:
    - web_search_tool
eval:
  general:
    workflow_alias: "freshqa_eval_full_workflow_with_intent_classifier_and_depth_router"
    output_dir: frontends/benchmarks/freshqa/results
    max_concurrency: 1
    dataset:
      _type: json
      file_path: frontends/benchmarks/freshqa/data/FreshQA_v112425.json
      structure:
        question_key: question
        answer_key: expected_output
        generated_answer_key: generated_answer

  evaluators:
    freshqa:
      _type: freshqa_evaluator
      llm_name: judge_llm
      dataset_file: frontends/benchmarks/freshqa/data/FreshQA_v112425.json
