[project]
name = "aiq-harbor"
version = "0.1.0"
description = "Harbor evaluation integration for NVIDIA AI-Q."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "harbor==0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",
    "ruff~=0.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiq_harbor"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "adapters/deepsearchqa/tests",
    "adapters/deepresearch-bench-ii/tests",
]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PL", "UP"]
extend-ignore = [
    "PLC0415",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR1702",
    "PLR2004",
    "PLW0108",
    "PLW2901",
    "PLW0603",
    "PLE1205",
]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["aiq_harbor"]

[tool.ruff.format]
exclude = ["**/task-template/tests/official/**"]

[tool.uv.workspace]
members = ["adapters/*"]
