[project]
name = "aiq-adapter-deepresearch-bench-ii"
version = "0.1.0"
description = "Harbor adapter for the DeepResearch Bench II benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
test = [
    "harbor==0.22.0",
    "pytest>=8.0",
]

[project.scripts]
deepresearch-bench-ii = "deepresearch_bench_ii.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch_bench_ii"]
