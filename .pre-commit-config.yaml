repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.26
    hooks:
      - id: uv-lock
        name: uv lock (root)
        exclude: ^mcp/(pyproject\.toml|uv\.lock)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        exclude: ^deploy/helm/helm-charts-k8s/.*/templates/.*\.ya?ml$
      - id: end-of-file-fixer
        exclude: ^skills/[^/]+/skill\.oms\.sig$
      - id: trailing-whitespace
        exclude: ^skills/[^/]+/skill-card\.md$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: ^skills/[^/]+/skill\.oms\.sig$

  - repo: local
    hooks:
      - id: validate-skills
        name: Validate agent skills
        entry: python scripts/validate_skills.py .agents/skills
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        files: ^\.agents/skills/
        pass_filenames: false
      - id: uv-lock-mcp
        name: uv lock (MCP)
        entry: uv lock --project mcp --check
        language: system
        files: ^(pyproject\.toml|mcp/(pyproject\.toml|uv\.lock)|sources/(knowledge_layer|tavily_web_search)/pyproject\.toml)$
        pass_filenames: false
      - id: clear-notebook-output-cells
        name: Clear Jupyter Notebook Output Cells
        entry: ci/scripts/clear_notebook_output_cells.sh
        files: "\\.ipynb$"
        language: script
      - id: helm-lint
        name: helm lint (deploy charts)
        entry: bash -c 'for chart in deploy/helm/helm-charts-k8s/*; do if [ -d "$chart" ]; then helm lint "$chart"; fi; done'
        language: system
        pass_filenames: false
        stages: [push]
      - id: pytest-root
        name: pytest (root)
        entry: uv run --frozen --group dev pytest tests sources --cov=deep_researcher_agent --cov-report=term --cov-fail-under=65
        language: system
        pass_filenames: false
        stages: [push]
      - id: pytest-mcp
        name: pytest (MCP)
        entry: uv run --project mcp --frozen --extra dev pytest mcp/tests --cov=mcp/src/deep_researcher_mcp --cov-report=term --cov-fail-under=90
        language: system
        pass_filenames: false
        stages: [push]

  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.11.2
    hooks:
      - id: markdown-link-check
        args: ["-q", "--config", "ci/markdown-link-check-config.json"]
        exclude: ^skills/[^/]+/skill-card\.md$

default_language_version:
  python: python3
