[project]
name = "deep-researcher-nemo-retriever-local-environment"
version = "0.1.0"
description = "Isolated Python 3.12 environment for Deep Researcher Agent's embedded NeMo Retriever backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deep-researcher-agent",
    "deep-researcher-api",
    "filelock>=3.20.3,<4",
    "knowledge-layer",
    "nemo-retriever",
    "tavily-web-search",
]

[tool.uv]
package = false
prerelease = "allow"
required-version = ">=0.11.25"
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
[tool.uv.sources]
deep-researcher-agent = { path = "../..", editable = true }
deep-researcher-api = { path = "../../frontends/deep_researcher_api", editable = true }
knowledge-layer = { path = "../../sources/knowledge_layer", editable = true }
nemo-retriever = { git = "https://github.com/NVIDIA/NeMo-Retriever.git", rev = "c80f4a5189ee10b98cbdb93e2f853ceb7b699c3b", subdirectory = "nemo_retriever" } # pragma: allowlist secret
tavily-web-search = { path = "../../sources/tavily_web_search", editable = true }

[dependency-groups]
test = [
    "pytest>=8.0.2,<9",
    "pytest-asyncio>=0.21,<2",
]
