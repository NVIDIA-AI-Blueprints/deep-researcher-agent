[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 83", "setuptools-scm>=8"]

[project]
name = "deep-researcher-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for the NVIDIA Deep Researcher Agent Blueprint"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "NVIDIA Corporation"},
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "deep-researcher-agent>=2.0,<3",
    "asyncpg>=0.29.0",
    "langchain-core>=1.2.0,<2",
    "mcp==1.28.1",
    "msgpack>=1.2.1",
    "nvidia-nat-core==1.8.0",
    "python-dotenv>=1.0,<2",
    "starlette>=1.0,<2",
    "tavily-web-search>=1.0,<2",
    "uvicorn>=0.40,<1",
]

[project.scripts]
deep-researcher-mcp-server = "deep_researcher_mcp.server:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "langgraph>=1.2,<2",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# The MCP release is intentionally a separate uv project. Its audited container
# uses cryptography 50 without changing the NAT-supported dependency set used by
# the root Deep Researcher Agent workspace. These overrides are release-resolution policy; they
# are not encoded in the locally built package metadata.
[tool.uv]
required-version = ">=0.11.25"
prerelease = "allow"
override-dependencies = [
    "authlib>=1.6.11,<2",
    "banks>=2.4.2,<3",
    { package = { name = "langchain-litellm", version = "0.6.6" }, dependencies = ["cryptography>=50.0.0,<51"] },
    { package = { name = "nvidia-nat-core", version = "1.8.0" }, dependencies = ["cryptography>=50.0.0,<51"] },
    { package = { name = "oci", version = "2.178.0" }, dependencies = ["cryptography>=50.0.0,<51"] },
    "defusedxml>=0.7.1,<0.8",
    "litellm>=1.83.7,<2",
    "lxml>=6.1.0,<7",
    "mako>=1.3.12,<2",
    "nltk>=3.10.0,<4",
    "pillow>=12.3.0,<13",
    "pyasn1>=0.6.4,<0.7",
    "pygments>=2.20.0,<3",
    "pyopenssl>=26.0.0,<27",
    "setuptools>=83.0.0",
    "tornado>=6.5.5",
]

[tool.uv.sources]
deep-researcher-agent = { path = "..", editable = true }
knowledge-layer = { path = "../sources/knowledge_layer", editable = true }
tavily-web-search = { path = "../sources/tavily_web_search", editable = true }
