{{- range $appName, $appConfig := .Values.apps }}
{{- $networkPolicy := $appConfig.networkPolicy | default dict }}
{{- if and $appConfig.enabled $networkPolicy.enabled }}
{{- if not $networkPolicy.allowedApps }}
{{- fail (printf "apps.%s.networkPolicy.allowedApps must contain at least one app" $appName) }}
{{- end }}
{{- if not $networkPolicy.ports }}
{{- fail (printf "apps.%s.networkPolicy.ports must contain at least one port" $appName) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deep-researcher.appFullname" (list $ $appName) }}
  namespace: {{ include "deep-researcher.namespace" $ }}
  labels:
    {{- include "deep-researcher.appLabels" (list $ $appName $appConfig) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "deep-researcher.appSelectorLabels" (list $ $appName) | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    {{- range $allowedAppName := $networkPolicy.allowedApps }}
    - podSelector:
        matchLabels:
          {{- include "deep-researcher.appSelectorLabels" (list $ $allowedAppName) | nindent 10 }}
    {{- end }}
    ports:
      {{- toYaml $networkPolicy.ports | nindent 4 }}
{{- end }}
{{- end }}
