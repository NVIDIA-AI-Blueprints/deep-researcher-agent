[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 83", "setuptools-scm>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"aiq_agent.agents.chat_researcher" = ["prompts/*.j2"]
"aiq_agent.agents.clarifier" = ["prompts/*.j2"]
"aiq_agent.agents.data_science" = ["prompts/*.j2"]
"aiq_agent.agents.deep_researcher" = ["prompts/*.j2", "skills/**/*"]
"aiq_agent.agents.report_rewriter" = ["prompts/*.j2"]
"aiq_agent.agents.shallow_researcher" = ["prompts/*.j2"]

[project]
name = "aiq-agent"
version = "2.2.0"
description = "NVIDIA AI-Q Blueprint - An enterprise-grade agent for intelligent research assistance"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat-core==1.8.0",
    "nvidia-nat[langchain,async_endpoints,phoenix,mcp]==1.8.0",
    "nvidia-nat-eval==1.8.0",
    "nvidia-nat-profiler==1.8.0",
    "nvidia-nat-redis==1.8.0",
    "nvidia-nat-security[guardrails]==1.8.0",
    "nemo-relay[deepagents,langchain,langgraph]>=0.8,<0.9",
    "deepagents>=0.7.4,<0.8",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-modal==0.0.6",
    "psycopg[binary]>=3.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.27,<0.1",
    "knowledge-layer[all]",
    # CVE version floors for transitive dependencies
    "mcp>=1.28.1,<2",
    "pillow>=12.3.0,<13",
    "pyasn1>=0.6.4,<0.7",
    "pygments>=2.20.0,<3",
]

[project.optional-dependencies]
pii = [
    "nvidia-nat-security[defense]==1.8.0",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]
s3 = [
    "boto3>=1.35.0,<2",
]
sandboxed-python-test = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
    "pre-commit>=3.5.0",
    "ruff~=0.15.1",
    "yapf>=0.40.0",
    "mypy>=1.5.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-mermaid>=0.0.8",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autobuild>=2025.8.25",
    "nvidia-sphinx-theme>=0.0.9.post1",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=2.0.1",
]
viz = [
    "pygraphviz>=1.11",
]

[tool.aiq.openshell]
release-tag = "v0.0.88"
adapter-version = "0.1.0"
installer-sha256 = "c15d6cb8090e1c7c8d79a320b5bcbdaf1c15c2363942d81e84b56e03b836249e" # pragma: allowlist secret

# -----------------------------------------------------------------------------
# Workspace members are installed via: uv sync
# Individual packages: uv pip install -e ./frontends/cli
# See [tool.uv.workspace] below for auto-discovered packages
# -----------------------------------------------------------------------------

[project.entry-points."nat.plugins"]
aiq_chat_researcher = "aiq_agent.agents.chat_researcher.register"
aiq_shallow_researcher = "aiq_agent.agents.shallow_researcher.register"
aiq_deep_researcher = "aiq_agent.agents.deep_researcher.register"
aiq_fastapi_extensions = "aiq_agent.fastapi_extensions.register"
aiq_clarifier = "aiq_agent.agents.clarifier.register"
aiq_data_science = "aiq_agent.agents.data_science.register"
aiq_data_source_registry = "aiq_agent.common.data_source_registry"
aiq_guardrails = "aiq_agent.guardrails.register"

[tool.pytest.ini_options]
testpaths = ["tests", "sources/**/tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "aws: tests that require AWS resources",
    "integration: tests that require external services",
    "opensearch_serverless: tests that require Amazon OpenSearch Serverless",
]


[tool.ruff]
# Set the maximum line length to 120.
line-length = 120
target-version = "py311"

[tool.ruff.lint]

select = [
  # The E, F, W categories are flake8 rules.
  "E",
  "F",
  "W",
  # Enable isort support
  "I",
  # Enable partial pylint support
  "PL",
  # Enable pyupgrade support
  "UP"
]

extend-ignore = [
  "PLC0415", # Allow lazy imports inside functions
  # Disable all the "too-*" checks, as they are too strict for our codebase
  "PLR0904", # too-many-public-methods
  "PLR0911", # too-many-return-statements
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0914", # too-many-locals
  "PLR0915", # too-many-statements
  "PLR0917", # too-many-positional-arguments
  "PLR1702", # too-many-nested-blocks
  "PLR2004", # Magic value used in comparison this happens a lot within unittests
  "PLW0108", # unnecessary-lambda
  "PLW2901", # allow re-assigning a loop variable
  "PLW0603",
  "PLE1205"
]

# Notebooks: allow long lines (shell/code) and imports after other statements
[tool.ruff.lint.per-file-ignores]
"docs/notebooks/*.ipynb" = ["E501", "E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
force-single-line = true
known-first-party = ["aiq", "aiq_api", "aiq_mcp", "nat", "nat_*", "_utils"]
known-third-party = [
  "agno",
  "autogen",
  "crewai",
  "google",
  "langchain",
  "llama_index",
  "mem0ai",
  "redis",
  "semantic_kernel",
  "zep_cloud",
]
order-by-type = true

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
split_all_top_level_comma_separated_values = true
join_multiple_lines = true
indent_dictionary_value = true

# -----------------------------------------------------------------------------
# uv Workspace Configuration
# Auto-discovers packages in sources/ and frontends/ directories
#
# Usage:
#   uv sync --group dev                 # Install AI-Q development dependencies
#   uv sync --project mcp --extra dev   # Install the isolated MCP test environment
#   uv sync --package aiq-agent  # Install only the root package
#   uv pip install -e ./frontends/cli    # Install a specific package
#   uv pip install -e "./frontends/aiq_api[postgres]"  # With extras
# -----------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
    "pre-commit>=3.5.0",
    "ruff~=0.15.1",
    "yapf>=0.40.0",
    "mypy>=1.5.0",
    "dask[distributed]>=2024.1.0",
    # Workspace packages for testing
    "aiq-gsf",
    "google-scholar-paper-search",
    "tavily-web-search",
    "exa-web-search",
    "nimble-web-search",
    "you-com",
    "duckduckgo-news-search",
    "polymarket-prediction-market",
    "knowledge-layer[all]",
    "aiq-api",
    "aiq-research-cli",
    "aiq-debug",
]
[tool.uv]
prerelease = "allow"
override-dependencies = [
    "authlib>=1.6.11,<2",
    "cryptography>=46.0.6,<47",
    "mcp>=1.28.1,<2",
    "pillow>=12.3.0,<13",
    "pygments>=2.20.0,<3",
    "pyopenssl>=26.0.0,<27",
    "setuptools>=83.0.0",
    "tornado>=6.5.5",
    "litellm>=1.83.7,<2",
    "mako>=1.3.12,<2",
    "banks>=2.4.2,<3",
    "lxml>=6.1.0,<7",
    "defusedxml>=0.7.1,<0.8",
    "nltk>=3.10.0,<4",
    "pyasn1>=0.6.4,<0.7",
    "aiohttp>=3.14.3,<4",
]

[tool.uv.pip]
prerelease = "if-necessary-or-explicit"

[tool.uv.workspace]
members = [
    "sources/*",
    "frontends/aiq_api",
    "frontends/cli",
    "frontends/debug",
    "frontends/benchmarks/freshqa",
    "frontends/benchmarks/deepsearch_qa",
]
exclude = ["mcp"]

[tool.uv.sources]
aiq-agent = { workspace = true }
aiq-gsf = { workspace = true }
google-scholar-paper-search = { workspace = true }
tavily-web-search = { workspace = true }
exa-web-search = { workspace = true }
nimble-web-search = { workspace = true }
you-com = { workspace = true }
duckduckgo-news-search = { workspace = true }
polymarket-prediction-market = { workspace = true }
knowledge-layer = { workspace = true }
nemo-relay = { git = "https://github.com/NVIDIA/NeMo-Relay.git", rev = "ffb24817442bac99212da0971b13bdad5bc4d84d" }  # pragma: allowlist secret
aiq-api = { workspace = true }
aiq-research-cli = { workspace = true }
aiq-debug = { workspace = true }
freshqa-eval = { workspace = true }
deepsearch-qa-evaluator = { workspace = true }
