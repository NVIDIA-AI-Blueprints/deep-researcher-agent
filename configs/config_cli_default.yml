# This is the default configuration for the CLI mode.
# It has the following features:
# - Human-in-the-loop clarification and plan approval before deep research starts
# - Web search and Paper search tools by default
# - There is no knowledge retrieval

general:
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

llms:
  nemotron_lightning_intent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.1
    top_p: 0.9
    max_tokens: 1024
    num_retries: 5
    parallel_tool_calls: false
    chat_template_kwargs:
      enable_thinking: false

  # Known limitation: Build-hosted Lightning can intermittently produce citation-incomplete shallow drafts.
  # Deep Researcher Agent fails closed; see docs/source/resources/troubleshooting.md#nemotron-35-lightning-on-nvidia-api-catalog.
  nemotron_lightning_agent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    num_retries: 5
    parallel_tool_calls: false
    chat_template_kwargs:
      enable_thinking: true

  nemotron_ultra_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false

  nemotron_ultra_writer_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false

functions:
  # =========================================================================
  # Data Source Registry
  # =========================================================================
  # Central registry that controls:
  #   1. UI toggles — each source appears as an on/off switch in the frontend
  #   2. Per-message filtering — users can select active sources per request
  #   3. Tool auto-inheritance — agents with no explicit `tools` list receive
  #      every tool listed here (use `exclude_tools` on agents to specialize)
  #
  # Source entry fields:
  #   id, name, description, tools, requires_auth (default: false),
  #   default_enabled (default: true)
  #
  # See docs/source/customization/tools-and-sources.md for full details.
  # =========================================================================
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      # - id: paper_search
      #   name: "Academic Papers"
      #   description: "Search academic papers and scientific publications."
      #   tools:
      #     - paper_search_tool

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  # Paper Search (optional - requires SERPER_API_KEY)
  # Uncomment the block below and set SERPER_API_KEY to enable academic paper search.
  # paper_search_tool:
  #   _type: paper_search
  #   max_results: 5
  #   serper_api_key: ${SERPER_API_KEY}

  # =========================================================================
  # Agents — inherit all registry tools; use exclude_tools to specialize
  # =========================================================================
  intent_classifier:
    _type: intent_classifier
    llm: nemotron_lightning_intent_llm
    # tools: omitted -> inherits all from data_source_registry
    # exclude_tools: []
    # llm_timeout: 90  # optional; seconds for intent LLM call (default 90)

  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_ultra_llm
    # tools: omitted -> inherits all from data_source_registry
    # exclude_tools: []
    max_turns: 3
    log_response_max_chars: 2000

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_lightning_agent_llm
    # tools: omitted -> inherits all from data_source_registry
    exclude_tools:
      - advanced_web_search_tool
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: nemotron_ultra_llm
    source_router_llm: nemotron_ultra_llm
    researcher_llm: nemotron_ultra_llm
    max_researcher_model_calls: 100
    planner_llm: nemotron_ultra_llm
    writer_llm: nemotron_ultra_writer_llm
    exclude_tools:
      - web_search_tool

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: true
  checkpoint_db: ${DEEP_RESEARCHER_CHECKPOINT_DB:-./checkpoints.db}
