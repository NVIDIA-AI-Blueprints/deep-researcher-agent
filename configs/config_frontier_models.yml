# This is the shipped GPT frontier model profile. Validate the complete workflow
# with these exact provider endpoints and credentials before deployment.
# It has the following features:
# - GPT Sol for orchestration, planning, and report writing
# - GPT Luna for source routing and research
# - OpenAI API access through the standard OPENAI_API_KEY
# - Knowledge retrieval using LlamaIndex
# - Web search by default; Paper search is available as a commented opt-in

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: deep_researcher_api
    runner_class: deep_researcher_api.plugin.DeepResearcherAPIWorker
    # =========================================================================
    # Knowledge API is automatically enabled when knowledge_retrieval function
    # is configured
    # =========================================================================
    # Async Job API Settings
    # =========================================================================
    # Async job infrastructure database (NAT JobStore + EventStore)
    # Used by: /v1/jobs/async routes, SSE streaming, job status persistence
    # Requires async driver for SQLite (aiosqlite) or PostgreSQL (asyncpg)
    # Environment overrides:
    # - NAT_JOB_STORE_DB_URL (direct override)
    # - NAT_JOB_STORE_DB_URL_DEV / NAT_JOB_STORE_DB_URL_PROD (via NAT_ENV)
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    # Job expiry - how long completed jobs stay in database before cleanup
    expiry_seconds: 86400  # 24 hours (min: 600, max: 604800/7 days)
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  gpt_luna_intent_llm:
    _type: openai
    model_name: "gpt-5.6-luna"
    api_key: ${OPENAI_API_KEY}
    max_tokens: 1024
    num_retries: 2
    parallel_tool_calls: false

  gpt_luna_shallow_llm:
    _type: openai
    model_name: "gpt-5.6-luna"
    api_key: ${OPENAI_API_KEY}
    max_tokens: 8192
    num_retries: 2
    parallel_tool_calls: false

  gpt_sol_agent_llm:
    _type: openai
    model_name: "gpt-5.6-sol"
    api_key: ${OPENAI_API_KEY}
    max_tokens: 16384
    num_retries: 2
    parallel_tool_calls: false

  gpt_sol_writer_llm:
    _type: openai
    model_name: "gpt-5.6-sol"
    api_key: ${OPENAI_API_KEY}
    max_tokens: 32768
    num_retries: 2
    parallel_tool_calls: false

  gpt_luna_agent_llm:
    _type: openai
    model_name: "gpt-5.6-luna"
    api_key: ${OPENAI_API_KEY}
    max_tokens: 16384
    num_retries: 2
    parallel_tool_calls: false

  # LLM for document summaries (required when generate_summary: true)
  summary_llm:
    _type: nim
    model_name: google/gemma-4-31b-it
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.1
    max_tokens: 100

functions:
  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  # Knowledge Retrieval (see sources/knowledge_layer/KNOWLEDGE-LAYER-SETUP.md)
  knowledge_search:
    _type: knowledge_retrieval
    backend: llamaindex
    collection_name: ${COLLECTION_NAME:-test_collection}
    generate_summary: true
    summary_model: summary_llm                     # Required when generate_summary: true
    summary_db: ${DEEP_RESEARCHER_SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}
    top_k: 5
    chroma_dir: ${DEEP_RESEARCHER_CHROMA_DIR:-/tmp/chroma_data}

  # Paper Search (optional - requires SERPER_API_KEY)
  # Uncomment the block below and set SERPER_API_KEY to enable academic paper search.
  # paper_search_tool:
  #   _type: paper_search
  #   max_results: 5
  #   serper_api_key: ${SERPER_API_KEY}

  intent_classifier:
    _type: intent_classifier
    llm: gpt_luna_intent_llm
    tools:
      - web_search_tool
      # - paper_search_tool  # Uncomment if SERPER_API_KEY is set
      - knowledge_search

  clarifier_agent:
    _type: clarifier_agent
    llm: gpt_sol_agent_llm
    tools:
      - web_search_tool
      - knowledge_search
    max_turns: 3
    log_response_max_chars: 2000

  shallow_research_agent:
    _type: shallow_research_agent
    llm: gpt_luna_shallow_llm
    tools:
      - web_search_tool
      - knowledge_search
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: gpt_sol_agent_llm
    source_router_llm: gpt_luna_agent_llm
    researcher_llm: gpt_luna_agent_llm
    planner_llm: gpt_sol_agent_llm
    writer_llm: gpt_sol_writer_llm
    tools:
      # - paper_search_tool  # Uncomment if SERPER_API_KEY is set
      - advanced_web_search_tool
      - knowledge_search


workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${DEEP_RESEARCHER_CHECKPOINT_DB:-./checkpoints.db}
