# Direct, non-interactive DS ReAct profile for FDABench-Lite. The benchmark
# adapter must include the task database name and any labeled choices in the
# user request. Endpoint URLs and credentials are supplied only through env.
# Required: AIQ_DATA_SCIENCE_MODEL, INFERENCE_NVIDIA_API_KEY,
# AIQ_INFERENCE_BASE_URL, TAVILY_API_KEY, GSF_BASE_URL, GSF_EMAIL,
# GSF_PASSWORD, RAG_SERVER_URL, COLLECTION_NAME.

general:
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

llms:
  data_science_llm:
    _type: openai
    model_name: ${AIQ_DATA_SCIENCE_MODEL}
    base_url: ${AIQ_INFERENCE_BASE_URL}
    api_key: ${INFERENCE_NVIDIA_API_KEY}
    temperature: 0.2
    max_tokens: 32768
    num_retries: 2
    request_timeout: 600

function_groups:
  gsf:
    _type: gsf
    base_url: ${GSF_BASE_URL}
    auth:
      mode: password
      email: ${GSF_EMAIL}
      password: GSF_PASSWORD  # pragma: allowlist secret
    include:
      - catalog_search
      - text_to_sql
    connect_timeout_seconds: 10
    read_timeout_seconds: ${GSF_READ_TIMEOUT_SECONDS:-600}
    max_retries: 2
    completion_wall_timeout_seconds: ${GSF_COMPLETION_WALL_TIMEOUT_SECONDS:-600}
    max_completion_retries: ${GSF_COMPLETION_RETRIES:-1}
    default_max_rows: 1000

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: structured_data
        name: "Enterprise Structured Data"
        description: "Discover benchmark database semantics and execute bounded analytical queries through GSF."
        tools:
          - gsf
      - id: knowledge_base
        name: "FDABench Knowledge Base"
        description: "Search the configured FDABench document collection for unstructured evidence."
        tools:
          - knowledge_search
      - id: web_search
        name: "Web Search"
        description: "Search the public web for current and external evidence."
        tools:
          - web_search_tool

  knowledge_search:
    _type: knowledge_retrieval
    backend: foundational_rag
    collection_name: ${COLLECTION_NAME}
    top_k: ${RAG_TOP_K:-5}
    rag_url: ${RAG_SERVER_URL}
    ingest_url: ${RAG_INGEST_URL:-http://127.0.0.1:9/v1}
    timeout: ${RAG_RETRIEVAL_TIMEOUT_SECONDS:-300}
    summary_db: ${AIQ_SUMMARY_DB:-sqlite+aiosqlite:////tmp/aiq-ds-lite-summaries.db}
    verify_ssl: ${RAG_VERIFY_SSL:-true}

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    advanced_search: true
    max_content_length: 2000

  data_science_agent:
    _type: data_science_agent
    llm: data_science_llm
    # tools omitted: inherit GSF, knowledge, and web tools from data_sources
    ontology_provider:
      provider: gsf
      catalog_tools: [gsf__catalog_search]
      analytical_tools: [gsf__text_to_sql]
    interaction_mode: headless
    response_mode: fdabench_choice
    structured_catalog_call_limit: ${AIQ_DS_STRUCTURED_CATALOG_CALL_LIMIT:-2}
    structured_text_to_sql_call_limit: ${AIQ_DS_STRUCTURED_TEXT_TO_SQL_CALL_LIMIT:-6}
    structured_cache_repeated_calls: true
    finalization_model_call_limit: ${AIQ_DS_FINALIZATION_MODEL_CALL_LIMIT:-18}
    recursion_limit: 64
    verbose: true

workflow:
  _type: data_science_workflow
