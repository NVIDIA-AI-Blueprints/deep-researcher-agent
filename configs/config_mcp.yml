# Public MCP-only workflow configuration.
#
# The FastMCP component owns the HTTP server and asynchronous submit/poll
# lifecycle, so this NAT configuration deliberately has no general.front_end
# and keeps Deep Researcher Agent's separate async deep-research layer disabled.
#
# Runtime choices preserved from the reference MCP service:
# - workflow.enable_clarifier: false (stateless MCP has no multi-turn HITL)
# - workflow.enable_escalation: true (intent routing selects shallow or deep)
# - workflow.use_async_deep_research: false (MCP is the only async job layer)
# - workflow.checkpoint_db: required shared PostgreSQL via DEEP_RESEARCHER_CHECKPOINT_DB
#
# Public credentials:
# - NVIDIA_API_KEY for hosted NIM inference
# - TAVILY_API_KEY for web search

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

llms:
  nemotron_lightning_intent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.1
    top_p: 0.9
    max_tokens: 1024
    num_retries: 5
    parallel_tool_calls: false
    chat_template_kwargs:
      enable_thinking: false

  # Known limitation: Build-hosted Lightning can intermittently produce citation-incomplete shallow drafts.
  # Deep Researcher Agent fails closed; see docs/source/resources/troubleshooting.md#nemotron-35-lightning-on-nvidia-api-catalog.
  nemotron_lightning_agent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    num_retries: 5
    parallel_tool_calls: false
    chat_template_kwargs:
      enable_thinking: true

  nemotron_ultra_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false

  nemotron_ultra_writer_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the public web for current information."
        tools:
          - web_search_tool
          - advanced_web_search_tool

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  intent_classifier:
    _type: intent_classifier
    llm: nemotron_lightning_intent_llm

  # Defined for workflow compatibility but disabled at the workflow boundary.
  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_ultra_llm
    max_turns: 3
    log_response_max_chars: 2000

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_lightning_agent_llm
    exclude_tools:
      - advanced_web_search_tool
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: nemotron_ultra_llm
    source_router_llm: nemotron_ultra_llm
    researcher_llm: nemotron_ultra_llm
    planner_llm: nemotron_ultra_llm
    writer_llm: nemotron_ultra_writer_llm
    exclude_tools:
      - web_search_tool

workflow:
  _type: chat_deepresearcher_agent
  enable_clarifier: false
  enable_escalation: true
  use_async_deep_research: false
  checkpoint_db: ${DEEP_RESEARCHER_CHECKPOINT_DB}
