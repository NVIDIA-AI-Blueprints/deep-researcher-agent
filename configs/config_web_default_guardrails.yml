# Default Web mode configuration with NeMo Guardrails enabled at the workflow,
# shallow researcher, and deep researcher boundaries.

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: deep_researcher_api
    runner_class: deep_researcher_api.plugin.DeepResearcherAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  nemotron_lightning_intent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.1
    top_p: 0.9
    max_tokens: 1024
    num_retries: 5
    parallel_tool_calls: false
    chat_template_kwargs:
      enable_thinking: false

  # Known limitation: Build-hosted Lightning can intermittently produce citation-incomplete shallow drafts.
  # Deep Researcher Agent fails closed; see docs/source/resources/troubleshooting.md#nemotron-35-lightning-on-nvidia-api-catalog.
  nemotron_lightning_agent_llm:
    _type: nim
    model_name: nvidia/nemotron-3.5-lightning-30b-a3b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    num_retries: 5
    parallel_tool_calls: false
    chat_template_kwargs:
      enable_thinking: true

  nemotron_ultra_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 16384
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false

  nemotron_ultra_writer_llm:
    _type: nim
    model_name: nvidia/nemotron-3-ultra-550b-a55b
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    top_p: 0.7
    max_tokens: 32768
    num_retries: 5
    chat_template_kwargs:
      enable_thinking: false


  summary_llm:
    _type: nim
    model_name: google/gemma-4-31b-it
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.1
    max_tokens: 100

middleware:
  workflow_guardrails:
    _type: workflow_guardrails
    workflow_functions:
      "<workflow>":
        choices:
          - message.content
    guardrails:
      models: []
      colang_version: "1.0"
      rails:
        config:
          regex_detection:
            input:
              patterns:
                # Shared by the workflow and direct research-agent boundaries so
                # endpoint choice cannot bypass the baseline input policy.
                - &prompt_override_pattern '(?i)\b(?:ignore|disregard|discard|override)\s+(?:(?:all|any|the)\s+)?(?:previous|prior|earlier)\s+instructions?\b'
                - &system_prompt_pattern '(?i)reveal\s+(the\s+)?system\s+prompt'
                - &secret_assignment_pattern '(?i)\b(?:api[\s_-]*key|password)\s*(?::|=|\bis\b|\bequals?\b)\s*\S+'
            output:
              patterns:
                - '(?i)system\s+prompt\s*[:=]'
                - '(?i)developer\s+message\s*[:=]'
        input:
          flows:
            - regex check input
        output:
          flows:
            - regex check output

  shallow_agent_guardrails:
    _type: shallow_agent_guardrails
    workflow_functions:
      shallow_research_agent:
        pre_invoke:
          messages:
            HumanMessage:
              - content
        post_invoke:
          messages:
            AIMessage:
              - content
    guardrails:
      models: []
      colang_version: "1.0"
      rails:
        config:
          regex_detection:
            input:
              patterns:
                - *prompt_override_pattern
                - *system_prompt_pattern
                - *secret_assignment_pattern
                - '(?i)reveal\s+(the\s+)?tool\s+credentials'
                - '(?i)show\s+(me\s+)?(your\s+)?tool\s+configuration'
            output:
              patterns:
                - '(?i)api[_-]?key\s*[:=]'
                - '(?i)password\s*[:=]'
        input:
          flows:
            - regex check input
        output:
          flows:
            - regex check output

  deep_agent_guardrails:
    _type: deep_agent_guardrails
    workflow_functions:
      deep_research_agent:
        pre_invoke:
          messages:
            HumanMessage:
              - content
        post_invoke:
          messages:
            AIMessage:
              - content
    guardrails:
      models: []
      colang_version: "1.0"
      rails:
        config:
          regex_detection:
            input:
              patterns:
                - *prompt_override_pattern
                - *system_prompt_pattern
                - *secret_assignment_pattern
                - '(?i)dump\s+(all\s+)?documents'
                - '(?i)exfiltrate\s+(the\s+)?knowledge\s+base'
                - '(?i)\b(?:dump|exfiltrate)(?:\s+and\s+(?:dump|exfiltrate))?\s+(?:(?:all|the)\s+)?(?:documents?|knowledge\s+base)\b'
            output:
              patterns:
                - '(?i)api[_-]?key\s*[:=]'
                - '(?i)password\s*[:=]'
        input:
          flows:
            - regex check input
        output:
          flows:
            - regex check output

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search uploaded documents and files."
        tools:
          - knowledge_search

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  knowledge_search:
    _type: knowledge_retrieval
    backend: llamaindex
    collection_name: ${COLLECTION_NAME:-test_collection}
    generate_summary: true
    summary_model: summary_llm
    summary_db: ${DEEP_RESEARCHER_SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}
    top_k: 5
    chroma_dir: ${DEEP_RESEARCHER_CHROMA_DIR:-/tmp/chroma_data}

  intent_classifier:
    _type: intent_classifier
    llm: nemotron_lightning_intent_llm

  clarifier_agent:
    _type: clarifier_agent
    llm: nemotron_ultra_llm
    max_turns: 3
    log_response_max_chars: 2000

  shallow_research_agent:
    _type: shallow_research_agent
    llm: nemotron_lightning_agent_llm
    exclude_tools:
      - advanced_web_search_tool
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: nemotron_ultra_llm
    source_router_llm: nemotron_ultra_llm
    researcher_llm: nemotron_ultra_llm
    planner_llm: nemotron_ultra_llm
    writer_llm: nemotron_ultra_writer_llm
    exclude_tools:
      - web_search_tool

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${DEEP_RESEARCHER_CHECKPOINT_DB:-./checkpoints.db}
  middleware:
    - workflow_guardrails
