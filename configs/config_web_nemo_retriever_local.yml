# Experimental zero-deployment NeMo Retriever Web configuration.
# AI-Q, NeMo Retriever, and LanceDB run in one Python 3.12 process. The
# standard web-search tools and configured inference endpoints may be remote.

general:
  # uvloop is unavailable on Windows. Keep this profile platform-neutral.
  use_uvloop: false
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    # Embedded Retriever owns a process-lifetime data-directory lock.
    dask_workers: threads
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  # Document ingestion does not call this model. Full chat requires an
  # OpenAI-compatible endpoint whose model supports tool calling.
  agent_llm:
    _type: openai
    model_name: ${AIQ_AGENT_LLM_MODEL:-openai/local-tool-model}
    base_url: ${AIQ_AGENT_LLM_BASE_URL:-http://127.0.0.1:1234/v1}
    api_key: ${AIQ_AGENT_LLM_API_KEY:-local}
    temperature: 0.2
    max_tokens: 32768
    num_retries: 3

functions:
  # Agents inherit tools from this registry and requests can select sources.
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      - id: knowledge_layer
        name: "Knowledge Base"
        description: "Search documents stored by embedded NeMo Retriever."
        tools:
          - knowledge_search

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  knowledge_search:
    _type: knowledge_retrieval
    backend: nemo_retriever_local
    collection_name: ${COLLECTION_NAME:-aiq-nrl-local}
    top_k: 5
    generate_summary: false
    backend_config:
      scope: ${NRL_SCOPE:-local}
      data_dir: ${NRL_LOCAL_DATA_DIR:-.aiq-data/nemo_retriever}
      profile: ${NRL_LOCAL_PROFILE:-auto}
      # Leave URL overrides empty for NRL's hosted defaults; set them for compatible external or self-hosted NIMs.
      page_elements_invoke_url: ${NRL_PAGE_ELEMENTS_INVOKE_URL:-}
      ocr_invoke_url: ${NRL_OCR_INVOKE_URL:-}
      table_structure_invoke_url: ${NRL_TABLE_STRUCTURE_INVOKE_URL:-}
      embed_invoke_url: ${NRL_EMBED_INVOKE_URL:-}
      embed_model_name: ${NRL_EMBED_MODEL_NAME:-}
      embed_model_provider_prefix: ${NRL_EMBED_MODEL_PROVIDER_PREFIX:-}
      # Hosted defaults accept an NVIDIA Build nvapi key. Leave unset to reuse NVIDIA_API_KEY,
      # or set NRL_INFERENCE_API_KEY to the same or a separate Build key.
      inference_api_key: ${NRL_INFERENCE_API_KEY:-}
      collection_ttl_hours: ${NRL_COLLECTION_TTL_HOURS:-24}

  # Paper Search (optional - requires SERPER_API_KEY).
  # paper_search_tool:
  #   _type: paper_search
  #   max_results: 5
  #   serper_api_key: ${SERPER_API_KEY}

  intent_classifier:
    _type: intent_classifier
    llm: agent_llm

  clarifier_agent:
    _type: clarifier_agent
    llm: agent_llm
    max_turns: 3
    log_response_max_chars: 2000

  shallow_research_agent:
    _type: shallow_research_agent
    llm: agent_llm
    exclude_tools:
      - advanced_web_search_tool
    verbose: true
    max_llm_turns: 10
    max_tool_iterations: 5
    enforce_citations: false

  deep_research_agent:
    _type: deep_research_agent
    enable_citation_verification: true
    orchestrator_llm: agent_llm
    source_router_llm: agent_llm
    researcher_llm: agent_llm
    planner_llm: agent_llm
    writer_llm: agent_llm
    exclude_tools:
      - web_search_tool

workflow:
  _type: chat_deepresearcher_agent
  enable_escalation: true
  enable_clarifier: true
  # Keep full research in this process; detached process jobs require service mode.
  use_async_deep_research: false
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
